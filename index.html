<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Family Poker</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#075b2a">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #075b2a;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Poker table */

.table {
    position: relative;
    width: min(96vw, 900px);
    height: min(92vh, 600px);

    background: #087a38;

    border: 12px solid #542f16;
    border-radius: 50%;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.5),
        0 10px 30px rgba(0,0,0,.5);
}

/* Community cards */

.community {
    position: absolute;
    top: 42%;
    left: 50%;

    transform: translate(-50%, -50%);

    display: flex;
    gap: 7px;
}

.card {
    width: 55px;
    height: 78px;

    background: white;
    color: black;

    border-radius: 6px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 27px;
    font-weight: bold;

    box-shadow: 0 2px 5px rgba(0,0,0,.4);
}

.card.red {
    color: #d00000;
}

/* Pot */

.pot {
    position: absolute;

    top: 22%;
    left: 50%;

    transform: translateX(-50%);

    color: white;

    font-size: 18px;
    font-weight: bold;
}

/* Players */

.player {
    position: absolute;

    width: 120px;

    text-align: center;

    color: white;
}

.player-name {
    font-weight: bold;
    margin-bottom: 4px;
}

.stack {
    font-size: 14px;
}

/* Player positions */

.p1 {
    bottom: 7%;
    left: 50%;
    transform: translateX(-50%);
}

.p2 {
    bottom: 20%;
    left: 5%;
}

.p3 {
    top: 20%;
    left: 5%;
}

.p4 {
    top: 7%;
    left: 50%;
    transform: translateX(-50%);
}

.p5 {
    top: 20%;
    right: 5%;
}

.p6 {
    bottom: 20%;
    right: 5%;
}

/* Hole cards */

.hole-cards {
    display: flex;
    justify-content: center;
    gap: 4px;
}

.hole-cards .card {
    width: 38px;
    height: 52px;
    font-size: 19px;
}

/* Actions */

.actions {
    position: fixed;

    bottom: 10px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    gap: 8px;
}

.actions button {
    border: none;

    padding: 10px 15px;

    border-radius: 7px;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

.fold {
    background: #c62828;
    color: white;
}

.call {
    background: #1976d2;
    color: white;
}

.raise {
    background: #f9a825;
    color: black;
}

/* Mobile */

@media (max-width: 600px) {

    .table {
        width: 98vw;
        height: 82vh;
        border-width: 8px;
    }

    .card {
        width: 42px;
        height: 60px;
        font-size: 21px;
    }

    .pot {
        top: 27%;
        font-size: 15px;
    }

    .player {
        width: 85px;
        font-size: 13px;
    }

    .hole-cards .card {
        width: 30px;
        height: 42px;
        font-size: 15px;
    }

    .actions button {
        padding: 9px 12px;
        font-size: 14px;
    }
}

</style>
</head>

<body>

<div class="table">

    <div class="pot">
        Pot: 600 chips
    </div>

    <!-- Community cards -->

    <div class="community">

        <div class="card red">A♥</div>
        <div class="card">K♣</div>
        <div class="card red">7♦</div>
        <div class="card">?</div>
        <div class="card">?</div>

    </div>


    <!-- Player 1 -->

    <div class="player p1">

        <div class="player-name">
            You
        </div>

        <div class="hole-cards">

            <div class="card">Q♠</div>
            <div class="card red">J♥</div>

        </div>

        <div class="stack">
            9,400 chips
        </div>

    </div>


    <!-- Player 2 -->

    <div class="player p2">

        <div class="player-name">
            Player 2
        </div>

        <div class="hole-cards">

            <div class="card">🂠</div>
            <div class="card">🂠</div>

        </div>

        <div class="stack">
            10,000
        </div>

    </div>


    <!-- Player 3 -->

    <div class="player p3">

        <div class="player-name">
            Player 3
        </div>

        <div class="hole-cards">

            <div class="card">🂠</div>
            <div class="card">🂠</div>

        </div>

        <div class="stack">
            9,800
        </div>

    </div>


    <!-- Player 4 -->

    <div class="player p4">

        <div class="player-name">
            Player 4
        </div>

        <div class="hole-cards">

            <div class="card">🂠</div>
            <div class="card">🂠</div>

        </div>

        <div class="stack">
            10,200
        </div>

    </div>


    <!-- Player 5 -->

    <div class="player p5">

        <div class="player-name">
            Player 5
        </div>

        <div class="hole-cards">

            <div class="card">🂠</div>
            <div class="card">🂠</div>

        </div>

        <div class="stack">
            9,700
        </div>

    </div>


    <!-- Player 6 -->

    <div class="player p6">

        <div class="player-name">
            Player 6
        </div>

        <div class="hole-cards">

            <div class="card">🂠</div>
            <div class="card">🂠</div>

        </div>

        <div class="stack">
            10,000
        </div>

    </div>

</div>


<!-- Action buttons -->

<div class="actions">

    <button class="fold">
        Fold
    </button>

    <button class="call">
        Call 200
    </button>

    <button class="raise">
        Raise
    </button>

</div>


<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./sw.js")

            .then(() => {
                console.log("Service Worker registered");
            })

            .catch(error => {
                console.error(
                    "Service Worker error:",
                    error
                );
            });

    });

}

</script>

</body>
</html>
