<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Family Poker</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#075b2a">

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #075b2a;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================
   POKER TABLE
========================= */

.table {
    position: relative;

    width: min(96vw, 1000px);
    height: min(88vh, 620px);

    background: #087a38;

    border: 12px solid #542f16;
    border-radius: 50%;

    box-shadow:
        inset 0 0 35px rgba(0,0,0,.5),
        0 10px 30px rgba(0,0,0,.5);
}

/* =========================
   TOP PLAYERS
========================= */

.top-players {
    position: absolute;

    top: 4%;
    left: 5%;
    right: 5%;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

/* Individual player */

.player {
    width: 100px;

    text-align: center;

    color: white;

    font-size: 13px;
}

/* Player photo */

.avatar {
    width: 58px;
    height: 58px;

    border-radius: 50%;

    object-fit: cover;

    border: 3px solid white;

    box-shadow:
        0 2px 7px rgba(0,0,0,.6);

    background: #777;
}

/* Player name */

.player-name {
    margin-top: 4px;

    font-weight: bold;

    white-space: nowrap;
}

/* Chips */

.stack {
    margin-top: 2px;

    font-size: 12px;

    opacity: .9;
}

/* =========================
   COMMUNITY CARDS
========================= */

.community {
    position: absolute;

    top: 45%;
    left: 50%;

    transform: translate(-50%, -50%);

    display: flex;

    gap: 7px;
}

.card {
    width: 55px;
    height: 78px;

    background: white;

    color: black;

    border-radius: 6px;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 27px;

    font-weight: bold;

    box-shadow:
        0 2px 5px rgba(0,0,0,.5);
}

.card.red {
    color: #d00000;
}

/* =========================
   POT
========================= */

.pot {
    position: absolute;

    top: 28%;

    left: 50%;

    transform: translateX(-50%);

    color: white;

    font-size: 18px;

    font-weight: bold;

    background: rgba(0,0,0,.15);

    padding: 4px 12px;

    border-radius: 15px;
}

/* =========================
   YOU
========================= */

.you {
    position: absolute;

    bottom: 5%;

    left: 50%;

    transform: translateX(-50%);

    text-align: center;

    color: white;
}

.you-name {
    font-size: 16px;

    font-weight: bold;

    margin-bottom: 4px;
}

.you-stack {
    font-size: 14px;

    margin-top: 4px;
}

/* Your cards */

.hole-cards {
    display: flex;

    justify-content: center;

    gap: 7px;
}

.hole-cards .card {
    width: 52px;
    height: 72px;

    font-size: 25px;
}

/* =========================
   ACTION BUTTONS
========================= */

.actions {
    position: fixed;

    bottom: 10px;

    left: 50%;

    transform: translateX(-50%);

    display: flex;

    gap: 8px;
}

.actions button {
    border: none;

    padding: 10px 18px;

    border-radius: 7px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}

.fold {
    background: #c62828;
    color: white;
}

.call {
    background: #1976d2;
    color: white;
}

.raise {
    background: #f9a825;
    color: black;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .table {
        width: 99vw;
        height: 82vh;

        border-width: 8px;
    }

    .top-players {
        top: 3%;
        left: 2%;
        right: 2%;
    }

    .player {
        width: 65px;
        font-size: 11px;
    }

    .avatar {
        width: 45px;
        height: 45px;

        border-width: 2px;
    }

    .stack {
        font-size: 10px;
    }

    .community {
        top: 44%;

        gap: 4px;
    }

    .card {
        width: 39px;
        height: 56px;

        font-size: 19px;
    }

    .pot {
        top: 28%;

        font-size: 14px;
    }

    .hole-cards .card {
        width: 42px;
        height: 60px;

        font-size: 21px;
    }

    .you {
        bottom: 5%;
    }

    .you-name {
        font-size: 14px;
    }

    .you-stack {
        font-size: 12px;
    }

    .actions button {
        padding: 8px 12px;

        font-size: 13px;
    }
}

</style>
</head>

<body>

<div class="table">

    <!-- =========================
         FIVE OTHER PLAYERS
    ========================== -->

    <div class="top-players">

        <div class="player">

            <img
                class="avatar"
                src="images/player1.JPG"
                alt="Player 1">

            <div class="player-name">
                Player 1
            </div>

            <div class="stack">
                10,000
            </div>

        </div>


        <div class="player">

            <img
                class="avatar"
                src="images/player2.JPG"
                alt="Player 2">

            <div class="player-name">
                Player 2
            </div>

            <div class="stack">
                9,800
            </div>

        </div>


        <div class="player">

            <img
                class="avatar"
                src="images/player3.JPG"
                alt="Player 3">

            <div class="player-name">
                Player 3
            </div>

            <div class="stack">
                10,200
            </div>

        </div>


        <div class="player">

            <img
                class="avatar"
                src="images/player4.JPG"
                alt="Player 4">

            <div class="player-name">
                Player 4
            </div>

            <div class="stack">
                9,700
            </div>

        </div>


        <div class="player">

            <img
                class="avatar"
                src="images/player5.JPG"
                alt="Player 5">

            <div class="player-name">
                Player 5
            </div>

            <div class="stack">
                10,000
            </div>

        </div>

    </div>


    <!-- =========================
         POT
    ========================== -->

    <div class="pot">
        Pot: 600 chips
    </div>


    <!-- =========================
         COMMUNITY CARDS
    ========================== -->

    <div class="community">

        <div class="card red">A♥</div>

        <div class="card">K♣</div>

        <div class="card red">7♦</div>

        <div class="card">?</div>

        <div class="card">?</div>

    </div>


    <!-- =========================
         YOU
    ========================== -->

    <div class="you">

        <div class="you-name">
            You
        </div>

        <div class="hole-cards">

            <div class="card">Q♠</div>

            <div class="card red">J♥</div>

        </div>

        <div class="you-stack">
            9,400 chips
        </div>

    </div>

</div>


<!-- =========================
     ACTION BUTTONS
========================== -->

<div class="actions">

    <button class="fold">
        Fold
    </button>

    <button class="call">
        Call 200
    </button>

    <button class="raise">
        Raise
    </button>

</div>


<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./sw.js")

            .then(() => {
                console.log("Service Worker registered");
            })

            .catch(error => {
                console.error(
                    "Service Worker error:",
                    error
                );
            });

    });

}

</script>

</body>
</html>
